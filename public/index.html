<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quarter by Quarter</title>
<meta name="description" content="A weekly plan for memorizing one quarter (rubʿ) of the Qur'an at a time, with daily review.">
<meta name="theme-color" content="#2c6a5c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quarter by Quarter">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Amiri, Arabic letters only, with the tanween marks (ً ٌ) drawn slightly lower than stock Amiri,
   which sets every mark at one fixed height so tanween floats far above short letters like ع and ة.
   Latin text still comes from the Google Fonts Amiri. Modified copy of Amiri (SIL OFL 1.1). */
@font-face{font-family:"Amiri QBQ";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/amiri-qbq-400.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Amiri QBQ";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/amiri-qbq-700.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
/* Layout: a pocket agenda. The week strip stays on top, today's session reads as a timed agenda,
   and the quarters + method sit beside it on wide screens and below it on phones. */
:root{
  --bg:#f4f6f3;
  --surface:#ffffff;
  --ink:#1a2624;
  --muted:#5f6d69;
  --line:#dde3df;
  --accent:#2c6a5c;      /* mushaf-margin green */
  --accent-soft:#e3efea;
  --gold:#b98a2e;        /* recent / today */
  --gold-soft:#f6ecd6;
  --slate:#4f5f7a;       /* review */
  --slate-soft:#e7ebf3;
  --sky:#3f7d9c;         /* listen */
  --sky-soft:#e2eff5;
  --rest:#8a948f;
  --display-en:"Newsreader",Georgia,"Times New Roman",serif;
  --display-ar:"Amiri QBQ","Amiri","Traditional Arabic","Times New Roman",serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514;--surface:#172020;--ink:#e3ebe7;--muted:#9aa8a3;--line:#283331;
  --accent:#7cc3ae;--accent-soft:#1d322c;--gold:#e2b55a;--gold-soft:#33291a;
  --slate:#a3b2d4;--slate-soft:#232a39;--sky:#87c0db;--sky-soft:#1b2d36;--rest:#7d8884;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514;--surface:#172020;--ink:#e3ebe7;--muted:#9aa8a3;--line:#283331;
  --accent:#7cc3ae;--accent-soft:#1d322c;--gold:#e2b55a;--gold-soft:#33291a;
  --slate:#a3b2d4;--slate-soft:#232a39;--sky:#87c0db;--sky-soft:#1b2d36;--rest:#7d8884;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display-en);font-style:italic;font-weight:500;font-size:clamp(34px,6vw,46px);line-height:1;letter-spacing:-.01em}
[lang="ar"] h1{font-family:var(--display-ar);font-style:normal;font-weight:700;letter-spacing:0}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch;font-size:14px;text-wrap:pretty}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;flex:none}
.lang:hover{border-color:var(--accent)}

.how{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:12px;padding:14px 16px}
.how h2{margin:0;font-size:14px;font-weight:600;color:var(--accent)}
.how ol{margin:8px 0 0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.how li::marker{color:var(--accent);font-weight:600}
.how b{font-weight:600}
.quote{margin:14px 0 0;padding:14px 16px 12px;border-radius:12px;background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--gold-soft) 35%,var(--surface)));border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.quote-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
[lang="ar"] .quote-top{letter-spacing:0;text-transform:none;font-size:13px}
.quote-next{background:none;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none}
.quote-next:hover{background:var(--surface)}
.quote-ar{margin:8px 0 0;font-family:var(--display-ar);font-size:21px;line-height:1.9;color:var(--ink);text-align:right;text-wrap:pretty}
.quote-ar.is-quran{font-size:23px}
.quote-en{margin:6px 0 0;font-size:13.5px;color:var(--muted);font-style:italic;text-align:left;text-wrap:pretty}
.quote-src{margin:6px 0 0;font-size:12px;color:var(--gold);font-weight:500}
@media (max-width:420px){.quote-ar{font-size:19px}.quote-ar.is-quran{font-size:21px}}
.reward-lede{margin:6px 0 0;color:var(--muted);font-size:14px;text-wrap:pretty}
.reward-lede.big{color:var(--gold);font-family:var(--display-en);font-style:italic;font-size:24px;line-height:1.2}
[lang="ar"] .reward-lede.big{font-family:var(--display-ar);font-style:normal;font-weight:700}
.reward-bar{margin-top:12px;height:8px;border-radius:999px;background:var(--line);overflow:hidden;--p:0}
.reward-bar span{display:block;height:100%;width:calc(var(--p)*100%);background:var(--accent);border-radius:inherit;transition:width .4s}
.reward.won .reward-bar span{background:var(--gold)}
.reward-stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.reward-stats .tas.ok{color:var(--accent);font-weight:600}
.reward-chosen{margin:12px 0 0;font-weight:600}
.reward-thanks{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.reward-label{margin-top:14px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
[lang="ar"] .reward-label{letter-spacing:0;text-transform:none;font-size:13px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.idea{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:start}
.idea:hover{border-color:var(--gold)}
.idea.on{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);font-weight:600}
.reward-custom{margin-top:8px;width:100%}
.reward-pick summary,.reward-big summary{cursor:pointer;list-style-position:inside}
.reward-pick summary::marker,.reward-big summary::marker{color:var(--gold)}
.reward-big{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.reward-big.lit{border-top-color:var(--gold)}
.reward-hizb{margin:0;font-size:13px;color:var(--muted)}
.reward.won{border-color:var(--gold);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 55%)}
.size{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.size-lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg);max-width:100%}
.segb{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.heavy{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.heavy .seg{background:var(--surface);align-self:flex-start}
.hint.warn{color:var(--gold)}
.heart{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.heart-q{margin:0;font-weight:600}
.heart-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);font-size:11.5px;line-height:1.2;min-width:0}
.hbtn svg{width:30px;height:30px;fill:transparent;stroke:var(--gold);stroke-width:1.6;transition:transform .15s,fill .15s}
.hbtn.fill svg{fill:var(--gold)}
.hbtn.on{color:var(--ink);font-weight:600}
.hbtn.on svg{transform:scale(1.15)}
.hbtn:hover svg{transform:scale(1.1)}
.heart-say{margin:10px 0 0;font-size:14px;color:var(--muted);text-wrap:pretty}
#heartDiary{margin-top:10px}
.hdot{display:block;line-height:0;margin-top:-1px}
.hdot svg{width:11px;height:11px;fill:var(--gold);opacity:calc(.3 + var(--h) * .14)}

.diary-form{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.diary-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.diary-row label{font-size:13px;color:var(--muted)}
.diary-row #dOther{flex:1;min-width:8em}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;width:100%;min-height:4.5em}
.toggle.save{align-self:flex-start;background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.diary-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.entry{padding:12px;border-radius:12px;background:var(--bg);border-inline-start:3px solid var(--gold)}
.entry.empty{border-inline-start-color:var(--line);color:var(--muted);font-size:13.5px}
.entry-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.entry-top span{font-size:12px;color:var(--muted)}
.entry-note{margin:6px 0 0;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.entry-del{margin-top:6px;background:none;border:0;padding:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.sh-lede{margin-top:6px}
.sheikh-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sheikh{padding:12px;border-radius:12px;background:var(--bg);border:1px solid transparent}
.sheikh.on{border-color:var(--accent);background:var(--accent-soft)}
.sh-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sh-name{font-family:var(--display-ar);font-size:19px;font-weight:700;line-height:1.3}
.sh-en{font-size:13.5px;font-weight:600}
.sh-late{font-family:var(--body);font-size:11.5px;font-weight:400;color:var(--muted)}
.sh-meta{font-size:12px;color:var(--muted)}
.sh-pick{flex:none;font-size:12px;padding:5px 10px}
.sh-pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sh-why{margin:6px 0 0;font-size:13.5px;color:var(--muted);text-wrap:pretty}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sh-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--accent);border:1px solid var(--accent-soft)}
#shLinks{margin-top:10px}
#shLinks a{color:var(--accent);font-weight:600}
.teacher{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.teacher label{font-size:13px;font-weight:600}
.planof{margin:0 0 4px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
[lang="ar"] .planof{letter-spacing:0;text-transform:none;font-size:14px}
.hello{margin-top:10px}
.acct{margin-top:10px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.acct .gbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.acct .gbtn:hover{border-color:var(--accent)}
.acct .gbtn svg{width:16px;height:16px;flex:none}
.acct .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.acct .dot.busy{background:var(--gold)}.acct .dot.off{background:var(--rest)}.acct .dot.err{background:#c0392b}
.acct .who{font-weight:600;color:var(--ink)}
.hello-line{margin:0;font-size:15px;font-weight:500}
.linkbtn{background:none;border:0;padding:0;margin-inline-start:6px;color:var(--accent);font-size:13px;text-decoration:underline;cursor:pointer}
.name-form{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.name-row{display:flex;gap:8px;flex-wrap:wrap}
.name-row input{flex:1;min-width:10em;max-width:18em}
.pick{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick label{font-size:13px;color:var(--muted)}
.pick select{max-width:100%}
.hint.behind{margin:8px 0 0;color:var(--gold)}
.card-preview{display:block;width:100%;max-width:340px;height:auto;margin:12px auto 0;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(0,0,0,.45);background:var(--bg)}
.keep-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.keep-actions label.toggle{cursor:pointer}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.restore-confirm{margin-top:12px;padding:12px;border-radius:12px;background:var(--gold-soft)}
.restore-confirm p{margin:0}
.keep-status{min-height:1.4em;margin:8px 0 0;font-size:13.5px;color:var(--accent);font-weight:600}
.past-h{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.past{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.past-item{padding:10px 12px;border-radius:12px;background:var(--bg);border-inline-start:3px solid var(--line)}
.past-item.won{border-inline-start-color:var(--gold)}
.past-item.empty{color:var(--muted);font-size:13.5px}
.past-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.past-save{font-size:12px;padding:4px 10px}
.past-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.past-hearts{display:flex;gap:4px;margin-top:6px}
.ph{width:14px;height:14px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.ph svg{width:14px;height:14px;fill:var(--gold);opacity:calc(.3 + var(--h) * .14)}
.ph:has(svg){background:none}
#rewardCardBtn{margin-top:10px}
/* banner */
.banner{margin-top:16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* week strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);margin-top:18px;padding-block:14px 10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
/* each day is a small tear-off calendar sheet: binder rings, coloured header, big date */
.day{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;
  box-shadow:0 2px 0 -1px var(--surface),0 2px 0 0 var(--line),0 4px 0 -1px var(--surface),0 4px 0 0 var(--line);transition:transform .15s,box-shadow .15s}
.day::before,.day::after{content:"";position:absolute;top:-6px;width:4px;height:11px;border-radius:3px;background:var(--muted);z-index:1}
.day::before{left:27%}.day::after{right:27%}
.day .dn{align-self:stretch;background:var(--accent);color:var(--surface);font-size:11px;font-weight:600;padding:7px 2px 4px;border-radius:8px 8px 0 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.day[data-d="6"] .dn{background:var(--gold)}
.day .dd{font-size:22px;font-weight:600;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.ring{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1turn),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--surface)}
.day.complete .ring{background:var(--accent)}
.day.complete .ring::after{inset:0;background:none;content:"✓";color:var(--surface);font-size:11px;font-weight:700;line-height:16px;text-align:center}
.day.today{border-color:var(--gold)}
.day.today .dd{color:var(--gold)}
.day.sel{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 0 0 2px var(--accent),0 6px 14px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.day .tag{font-size:9.5px;line-height:1;color:var(--gold);font-weight:600}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:12px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[lang="ar"] .card h2{letter-spacing:0;text-transform:none;font-size:14px}

/* day panel */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h3{margin:0;font-family:var(--display-en);font-style:italic;font-weight:500;font-size:30px;line-height:1.1}
[lang="ar"] .dayhead h3{font-family:var(--display-ar);font-style:normal;font-weight:700;font-size:30px}
.daymeta{color:var(--muted);font-size:14px;margin-top:4px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.controls label{font-size:13px;color:var(--muted)}
select,input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{width:5.2em;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--bg);font-size:13px}
.toggle[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}

.agenda{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:3.8em minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--bg)}
.item.notime{grid-template-columns:minmax(0,1fr) auto}
.time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35;padding-top:3px}
.time b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.body{min-width:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-inline-end:6px;vertical-align:1px}
.t-new .pill{background:var(--accent-soft);color:var(--accent)}
.t-recent .pill{background:var(--gold-soft);color:var(--gold)}
.t-review .pill{background:var(--slate-soft);color:var(--slate)}
.t-listen .pill{background:var(--sky-soft);color:var(--sky)}
.t-rest .pill{background:transparent;color:var(--rest);border:1px solid var(--line)}
.t-tasmee .pill{background:var(--accent);color:var(--surface)}
.t-close .pill{background:transparent;color:var(--accent);border:1px solid var(--accent-soft)}
.t-light .pill{background:var(--accent-soft);color:var(--accent)}
.t-tip .pill{background:transparent;color:var(--gold);border:1px dashed var(--gold)}
.t-rest{background:transparent;border:1px dashed var(--line)}
.t-tasmee{background:var(--accent-soft)}
.ttl{font-weight:600}
.sub{color:var(--accent);font-size:14px;font-weight:500;margin-top:1px}
.t-review .sub{color:var(--slate)}
.det{color:var(--muted);font-size:13.5px;margin-top:4px;text-wrap:pretty}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] svg{opacity:1;stroke:var(--surface)}
.item.done .ttl{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.or{font-size:12px;color:var(--muted);text-align:center;margin:-2px 0}
.donemsg{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;text-align:center}

/* quarters */
.q{display:flex;flex-direction:column;gap:6px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:10px}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.qh strong{font-size:15px}
.qh span{font-size:12.5px;color:var(--muted)}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.parts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.part{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.splits{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.splits input{width:4.6em;padding:4px 8px}
.splits select{padding:4px 8px;max-width:100%}
.qsel{width:100%;max-width:30em}
.custom summary{cursor:pointer;font-size:13px;color:var(--accent);width:fit-content}
.custom-range{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.custom-range .pair{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.custom-range select{max-width:12em}
.banner .qsel{flex:1 1 16em}
.rev{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:8px;align-items:center}
.rev .n{width:1.6em;height:1.6em;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:grid;place-items:center;font-size:12px;font-weight:600}
.rev input{width:100%}
.rev .when{grid-column:2;font-size:12px;color:var(--muted);margin-top:-2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* method + life */
ol.steps{margin:12px 0 0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:8px}
ol.steps li{padding-inline-start:4px}
ol.steps li::marker{color:var(--accent);font-weight:600}
ul.rules{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.rules li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
ul.rules b{font-weight:600}
ul.rules span{color:var(--muted);font-size:14px}
.prio{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
.prio i{font-style:normal;color:var(--muted)}

/* glance table */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
thead th{font-weight:600;color:var(--muted);background:var(--bg);font-size:12px}
tbody th{font-weight:600;color:var(--muted);white-space:nowrap;font-size:12px}
tr:last-child td,tr:last-child th{border-bottom:0}
td.sun{background:var(--accent-soft)}
td.today,th.today{box-shadow:inset 0 -2px 0 var(--gold)}
.foot{margin-top:24px;color:var(--muted);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:no-preference){.check,.day{transition:background .15s,border-color .15s}}
@media (max-width:420px){
  .item{grid-template-columns:3.4em minmax(0,1fr) auto;gap:10px;padding:11px 10px}
  .card{padding:16px 14px}
  .day .dn{font-size:11px}
}

function renderQuote() {
  const kind = dayKind(sel);

  const date = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + sel);
  const doy = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 864e5);
  const q = pool[(((doy * 5 + quoteShift) % pool.length) + pool.length) % pool.length];
  const ar = S.lang === 'ar';
  const open = q.k === 'q' ? '﴿' : '«', close = q.k === 'q' ? '﴾' : '»';
  $('#quoteText').textContent = `${open}${q.ar}${close}`;
  $('#quoteText').className = 'quote-ar' + (q.k === 'q' ? ' is-quran' : '');
  $('#quoteMeaning').hidden = ar;
  $('#quoteMeaning').textContent = q.en;
  $('#quoteSrc').textContent = (q.k === 'h' && !ar ? 'Hadith · ' : '') + q.src[ar ? 1 : 0];
  $('#quoteNext').textContent = ar ? 'غيرها' : 'Another';
  $('#quoteLabel').textContent = ar ? (q.k === 'q' ? 'من كتاب الله' : 'من السنة') : (q.k === 'q' ? 'From the Quran' : 'From the Sunnah');
}

function weekStats() {
  let done = 0, total = 0;
  for (let d = 0; d < 7; d++) { const [a, b] = tally(d); done += a; total += b; }
  const tasmee = !!dayProg(6).sunTasmee;
  return { done, total, tasmee, success: tasmee && total > 0 && done / total >= 0.8 };
}

function renderReward() {
  const R = REWARD_TXT[S.lang];
  const st = weekStats();
  // keep the record of successful weeks in step with the ticks
  S.wins = Array.isArray(S.wins) ? S.wins : [];
  const had = S.wins.includes(WEEK);
  S.winW = S.winW || {};
  const w = heavy() ? 0.5 : 1;
  if (st.success && (!had || S.winW[WEEK] !== w)) { if (!had) S.wins.push(WEEK); S.winW[WEEK] = w; save(); }
  if (!st.success && had) { S.wins = S.wins.filter((x) => x !== WEEK); delete S.winW[WEEK]; save(); }

  const reward = ((S.reward || {})[WEEK] || '').trim();
  const n = S.wins.reduce((sum, k) => sum + (S.winW[k] ?? 1), 0);
  const left = n % 4 === 0 ? 4 : 4 - (n % 4);
  const hizbNow = st.success && n > 0 && n % 4 === 0;

  const card = $('#reward');
  card.classList.toggle('won', st.success);
  $('#rewardTitle').textContent = R.title;
  $('#rewardLede').textContent = st.success ? (myName() ? KX().unlockedN(myName()) : R.unlocked) : R.lede;
  $('#rewardCardBtn').hidden = !st.success;
  $('#rewardCardBtn').textContent = KX().saveCard;
  $('#rewardLede').classList.toggle('big', st.success);
  $('#rewardBar').style.setProperty('--p', st.total ? Math.min(1, st.done / st.total) : 0);
  $('#rewardMeter').textContent = R.meter(num(st.done), num(st.total));
  $('#rewardTasmee').textContent = st.tasmee ? R.tasmeeYes : R.tasmeeNo;
  $('#rewardTasmee').classList.toggle('ok', st.tasmee);
  $('#rewardChosen').textContent = st.success ? R.earned(reward) : reward ? R.chosen(reward) : R.none;
  $('#rewardThanks').hidden = !st.success;
  $('#rewardThanks').textContent = R.thanks;
  $('#rewardIdeasLabel').textContent = reward ? R.ideasChange : R.ideas;
  if (rewardOpenSync) { $('#rewardPick').open = !reward; $('#rewardBigPick').open = hizbNow; rewardOpenSync = false; }
  $('#rewardIdeas').innerHTML = R.small.map((x) => `<button type="button" class="idea${x === reward ? ' on' : ''}" aria-pressed="${x === reward}">${esc(x)}</button>`).join('');
  const custom = $('#rewardCustom');
  custom.placeholder = R.custom;
  if (document.activeElement !== custom) custom.value = R.small.includes(reward) || R.big.includes(reward) ? '' : reward;
  $('#rewardHizb').textContent = R.hizb(qty(n), qty(left));
  $('#rewardBigLabel').textContent = hizbNow ? R.hizbDone : R.hizbNext;
  $('#rewardBig').innerHTML = R.big.map((x) => `<button type="button" class="idea big${x === reward ? ' on' : ''}" aria-pressed="${x === reward}">${esc(x)}</button>`).join('');
  $('#rewardBigWrap').classList.toggle('lit', hizbNow);
}

let rewardOpenSync = true;
const qty = (x) => { const whole = Math.floor(x), half = x - whole >= 0.5; return whole === 0 && half ? '½' : `${num(whole)}${half ? '½' : ''}`; };
function setReward(text) {
  rewardOpenSync = true;
  S.reward = { [WEEK]: text };
  save();

}

// ---- which part is memorized on a session day (defaults catch up automatically)
function memorizedBefore(d) {
  const set = new Set();
  for (const dd of SESSION_DAYS) if (dd < d && dayProg(dd).new) set.add(pickedPart(dd));
  return set;
}
function pickedPart(d) {
  const o = ((S.partPick || {})[WEEK] || {})[d];
  if (o !== undefined) return o;
  if (d > TODAY) return d;                      // future days follow the plan
  const before = memorizedBefore(d);
  for (let i = 0; i <= d; i++) if (!before.has(i)) return i;
  return d;
}
function memorizedAll() {
  const set = new Set();
  for (const dd of SESSION_DAYS) if (dayProg(dd).new) set.add(pickedPart(dd));
  for (const ld of [3, 4, 5]) for (let i = 0; i < 3; i++) if (dayProg(ld)['catch' + i]) set.add(i);
  return set;
}
function catchPart(ld) {
  if (TODAY < 3) return undefined;
  for (let i = 0; i < 3; i++) if (dayProg(ld)['catch' + i]) return i;
  const have = memorizedAll();
  for (let i = 0; i < 3; i++) if (!have.has(i)) return i;
  return undefined;
}

// ---- week snapshot (for the card and the history)
function tallyWith(d, prog) {
  const bs = blocks(d);
  const req = bs.filter((b) => !b.optional && !b.group);
  let total = req.length, done = req.filter((b) => prog[b.id]).length;
  if (bs.some((b) => b.group)) { total += 1; if (bs.some((b) => b.group && prog[b.id])) done += 1; }
  return [done, total];
}
const quartersTotal = () => (S.wins || []).reduce((s, k) => s + ((S.winW || {})[k] ?? 1), 0);
function snapshot(key) {
  const prog = (S.progress || {})[key] || {};
  const [y, m, d0] = key.split('-').map(Number);
  const days = [];
  let done = 0, total = 0;
  for (let d = 0; d < 7; d++) {
    const [a, b] = tallyWith(d, prog[d] || {});
    done += a; total += b;
    days.push({ a, b, date: isoDate(new Date(y, m - 1, d0 + d)), heart: (S.heart || {})[isoDate(new Date(y, m - 1, d0 + d))] || 0 });
  }
  const end = isoDate(new Date(y, m - 1, d0 + 6));
  return {
    key, end, days, done, total,
    tasmee: !!(prog[6] || {}).sunTasmee,
    success: (S.wins || []).includes(key),
    reward: (((S.reward || {})[key]) || '').trim(),
    range: active(), heavy: heavy(), hw: hw(),
    verses: (S.diary || []).filter((e) => e.date >= key && e.date <= end).length,
    quarters: quartersTotal(),
  };
}
function archiveOldWeeks() {
  const keys = Object.keys(S.progress || {}).filter((k) => k !== WEEK);
  if (!keys.length) return;
  S.history = Array.isArray(S.history) ? S.history : [];
  for (const k of keys) {
    const snap = snapshot(k);
    if (snap.done > 0) S.history = [snap, ...S.history.filter((h) => h.key !== k)];
  }
  S.history.sort((a, b) => (a.key < b.key ? 1 : -1));
  S.history = S.history.slice(0, 104);
  S.progress = { [WEEK]: (S.progress || {})[WEEK] || {} };
  save();
}

}

// ---- the week card (canvas → PNG)
const CARD = { bg: '#f4f6f3', surface: '#ffffff', ink: '#1a2624', muted: '#5f6d69', line: '#dde3df', accent: '#2c6a5c', accentSoft: '#e3efea', gold: '#b98a2e', goldSoft: '#f6ecd6' };
const HEART_PATH = 'M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.7 0 5.7 4 4.2 7.3C19.5 16.4 12 21 12 21z';

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

}

}
async function drawWeekCard(sn) {

}

async function saveFile(filename, data) {
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); return 'saved'; }
    catch (e) { return e && e.code === 'declined' ? 'declined' : 'error'; }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'saved';
  } catch (e) { return 'error'; }
}

function setDone(d, id, v) {
  S.progress = { [WEEK]: { ...(S.progress[WEEK] || {}) } }; // keep only the current week
  const cur = { ...dayProg(d) };

function tally(d) {
  const bs = blocks(d), prog = dayProg(d);
  const req = bs.filter((b) => !b.optional && !b.group);
  let total = req.length, done = req.filter((b) => prog[b.id]).length;

  return [done, total];
}

  if (pk.dataset.key === key) return;
  pk.dataset.key = key;
  pk.innerHTML = (bannerCont ? `<option value="c" selected>${esc(L().contQ(rng(bannerCont)))}</option>` : '') + rubOptions(selK, !bannerCont);
}
let bannerCont = null;

function renderHow() {
  const t = L(), a = active();
  const items = heavy() ? [t.howHeavy(hw(), a ? rng(a) : ''), ...t.how.slice(1)] : t.how;
  $('#howList').innerHTML = items.map((x) => `<li>${x}</li>`).join('');
}

function renderDynamic() { renderName(); renderExtras(); renderHow(); renderStrip(); renderDay(); renderParts(); renderGlance(); renderBanner(); renderReward(); renderKeep(); }

// ---------------------------------------------------------------- events
$('#langBtn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'ar' : 'en'; save(); renderStatic(); renderDynamic(); });
$('#strip').addEventListener('click', (e) => {
  const b = e.target.closest('.day');
  if (!b) return;
  sel = +b.dataset.d;
  quoteShift = 0;
  renderStrip(); renderDay();
});
$('#agenda').addEventListener('click', (e) => {
  const c = e.target.closest('.check');
  if (!c) return;
  setDone(sel, c.dataset.id, c.getAttribute('aria-checked') !== 'true');
  renderStrip(); renderDay(); renderReward();
});
$('#start').addEventListener('change', (e) => { S.start = +e.target.value; save(); renderDay(); });
$('#busyBtn').addEventListener('click', () => {
  const k = `${WEEK}:${sel}`;
  if (S.busy[k]) delete S.busy[k]; else S.busy[k] = true;
  for (const key of Object.keys(S.busy)) if (!key.startsWith(WEEK)) delete S.busy[key];
  save(); renderStrip(); renderDay(); renderReward();
});
['n', 'r'].forEach((p) => {
  $('#' + p + 'Pick').addEventListener('change', (e) => { if (e.target.value !== '') setRange(p, ...rubRange(+e.target.value)); });
  ['Sf', 'St'].forEach((id) => $('#' + p + id).addEventListener('change', (e) => customChanged(p, e)));
  ['Af', 'At'].forEach((id) => $('#' + p + id).addEventListener('input', (e) => customChanged(p, e)));
  ['Af', 'At'].forEach((id) => $('#' + p + id).addEventListener('blur', () => setTimeout(() => renderRangeUI(p), 0)));
});
['s1', 's2'].forEach((k) => $('#' + k).addEventListener('change', (e) => { S.range[k] = e.target.value; save(); renderDynamic(); }));
$('#len').addEventListener('change', (e) => { S.len = +e.target.value; save(); renderDay(); renderGlance(); });
$('#nbOk').addEventListener('click', () => {
  const v = $('#nbPick').value;
  const r = v === 'c' ? bannerCont : v !== '' ? rubRange(+v) : null;
  const q = quarter();
  if (!r) { $('#nbPick').focus(); return; }
  const [f, t] = r;
  if (q) S.recent = { from: String(q[0]), to: String(q[1]) };
  S.range = { from: String(f), to: String(t), s1: '', s2: '', h1: '' };
  S.size = 'normal'; S.hw = 1;
  S.weekKey = WEEK;
  save(); renderStatic(); renderDynamic();
});
$('#rewardIdeas').addEventListener('click', (e) => { const b = e.target.closest('.idea'); if (b) setReward(b.getAttribute('aria-pressed') === 'true' ? '' : b.textContent); });
$('#rewardBig').addEventListener('click', (e) => { const b = e.target.closest('.idea'); if (b) setReward(b.getAttribute('aria-pressed') === 'true' ? '' : b.textContent); });
$('#rewardCustom').addEventListener('input', (e) => { S.reward = { [WEEK]: e.target.value }; save(); });
$('#rewardCustom').addEventListener('change', () => renderReward());
$('#quoteNext').addEventListener('click', () => { quoteShift += 1; renderQuote(); });
const resetSplits = () => { S.range.s1 = ''; S.range.s2 = ''; $('#s1').value = ''; $('#s2').value = ''; };
$('#sizeNormal').addEventListener('click', () => { S.size = 'normal'; S.hw = 1; resetSplits(); save(); renderDynamic(); });
$('#sizeHeavy').addEventListener('click', () => { S.size = 'heavy'; S.hw = 1; resetSplits(); save(); renderDynamic(); });
$('#hw1').addEventListener('click', () => { S.hw = 1; resetSplits(); save(); renderDynamic(); });
$('#hw2').addEventListener('click', () => { S.hw = 2; resetSplits(); save(); renderDynamic(); });
$('#h1').addEventListener('change', (e) => { S.range.h1 = e.target.value; resetSplits(); save(); renderDynamic(); });
$('#nbHalf2').addEventListener('click', () => { S.hw = 2; resetSplits(); S.weekKey = WEEK; save(); renderStatic(); renderDynamic(); });
$('#nbRepeat').addEventListener('click', () => { S.weekKey = WEEK; save(); renderDynamic(); });
$('#nbLater').addEventListener('click', () => { bannerDismissed = true; renderBanner(); });

// ---------------------------------------------------------------- go
if (!S.weekKey || !quarter()) { if (!S.weekKey) S.weekKey = WEEK; }
archiveOldWeeks();
save(false);
setupExtras();
setupKeep();
renderStatic();
renderDynamic();
})();
</script>

<script type="module">
// ---- cloud sync: Google sign-in + Firestore (users/{uid}); works offline, local copy stays as before
const V = '11.0.2';
const box = document.getElementById('acct');
const TX = {
  en: { cta: 'Save my progress with Google', hint: 'so it stays safe and opens on any device', saved: 'Progress saved to', saving: 'Saving…', offline: 'Offline — will save when you’re back online', err: 'Couldn’t save — will retry', out: 'Sign out', fail: 'Sign-in didn’t finish. Try again.' },
  ar: { cta: 'احفظ تقدّمك بحساب Google', hint: 'عشان يفضل محفوظ ويفتح من أي جهاز', saved: 'تقدّمك محفوظ في', saving: 'جارٍ الحفظ…', offline: 'مفيش إنترنت — هيتحفظ أول ما يرجع', err: 'ماتحفظش — هنحاول تاني', out: 'تسجيل الخروج', fail: 'تسجيل الدخول ماكملش. جرّب تاني.' },
};
const tx = () => TX[document.documentElement.lang === 'ar' ? 'ar' : 'en'];
const G = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.8c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.7 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-10l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let user = null, status = 'ok', failed = false;
function draw() {
  const t = tx();
  box.hidden = false;
  if (!user) {
    box.innerHTML = `<button type="button" class="gbtn" id="gIn">${G}${esc(t.cta)}</button><span>${esc(failed ? t.fail : t.hint)}</span>`;
    document.getElementById('gIn').onclick = signIn;
  } else {
    const label = status === 'busy' ? t.saving : status === 'off' ? t.offline : status === 'err' ? t.err : `${t.saved} <span class="who">${esc(user.email || user.displayName)}</span>`;
    box.innerHTML = `<span class="dot ${status === 'ok' ? '' : status}"></span><span>${label}</span><button type="button" class="linkbtn" id="gOut">${esc(t.out)}</button>`;
    document.getElementById('gOut').onclick = () => fb.signOut(fb.auth);
  }
}
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

let fb = null;
async function boot() {
  let cfg;
  try { const r = await fetch('/__/firebase/init.json'); if (!r.ok) return; cfg = await r.json(); } catch (e) { return; } // not on Firebase Hosting: stay local-only
  if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) cfg.authDomain = location.hostname; // keeps redirect sign-in first-party
  const [appM, authM, fsM] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  await authM.setPersistence(auth, authM.browserLocalPersistence).catch(() => {});
  let db;
  try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
  catch (e) { db = fsM.getFirestore(app); }
  fb = { auth, signOut: authM.signOut, authM, fsM, db };
  authM.getRedirectResult(auth).catch(() => { failed = true; draw(); });
  authM.onAuthStateChanged(auth, (u) => { user = u; failed = false; attach(); draw(); });
  draw();
}

async function signIn() {
  const { authM, auth } = fb; const p = new authM.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  try {
    if (standalone) await authM.signInWithRedirect(auth, p);
    else await authM.signInWithPopup(auth, p);
  } catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
      try { await authM.signInWithRedirect(auth, p); return; } catch (e2) { /* fall through */ }
    }
    if (e.code !== 'auth/popup-closed-by-user') { failed = true; draw(); }
  }
}

// ---- sync
const DEV = (() => { try { let d = localStorage.getItem('qbq.dev'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('qbq.dev', d); } return d; } catch (e) { return 'x'; } })();
let unsub = null, ref = null, timer = 0, pendingRemote = null;
const localT = () => (window.QBQ.get()._t || 0);
const setStatus = (s) => { if (status !== s) { status = s; draw(); } };
function push() {
  if (!ref) return;
  clearTimeout(timer);
  setStatus(navigator.onLine ? 'busy' : 'off');
  timer = setTimeout(async () => {
    const S = window.QBQ.get();
    try {
      await fb.fsM.setDoc(ref, { state: JSON.stringify(S), t: S._t || Date.now(), dev: DEV });
      setStatus(navigator.onLine ? 'ok' : 'off');
    } catch (e) { setStatus('err'); setTimeout(push, 8000); }
  }, 700);
}
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio'; };
function applyRemote(d) {
  if (typing()) { pendingRemote = d; return; }
  pendingRemote = null;
  try { window.QBQ.apply(JSON.parse(d.state)); } catch (e) { /* bad payload: ignore */ }
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRemote && !typing() && pendingRemote.t > localT()) applyRemote(pendingRemote); }, 50));
function attach() {
  if (unsub) { unsub(); unsub = null; }
  ref = null; window.QBQ.onSave = null;
  if (!user) return;
  const { fsM, db } = fb;
  ref = fsM.doc(db, 'users', user.uid);
  window.QBQ.onSave = () => push();
  unsub = fsM.onSnapshot(ref, { includeMetadataChanges: false }, (snap) => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.data();
    if (!d) { push(); return; }                 // first time on this account: upload this device's progress
    if (d.t > localT()) applyRemote(d);         // newer elsewhere: take it
    else if (d.t < localT()) push();            // this device is ahead: upload
    else setStatus(navigator.onLine ? 'ok' : 'off');
  }, () => setStatus('err'));
}
addEventListener('online', () => { if (ref) push(); });
addEventListener('offline', () => { if (ref) setStatus('off'); });
boot().catch(() => {});
</script>
